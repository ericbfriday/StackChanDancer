name: Desktop and scheduler tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -p "test_*.py" -v
      - run: node --test tests/timeline.test.mjs
